name: CI

# A superseded run is cancelled when a new commit arrives on the same ref. That
# is the normal choice for a CI gate, and it matters here: a job stuck in a
# blocking call otherwise holds the queue until GitHub's six-hour timeout.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A failing ctest prints the failing test's output.
env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Build + test on Linux with both compilers.
  # ---------------------------------------------------------------------------
  linux:
    name: linux / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        if: matrix.compiler == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang

      # QLIB_BUILD_BENCH also gets the benchmark compiled and, through
      # qlib_bench_smoke, executed here.
      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: cmake -S . -B build -DQLIB_WERROR=ON -DQLIB_BUILD_BENCH=ON -DQLIB_BUILD_THREADS=ON -DQLIB_BUILD_LOG=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build

  # ---------------------------------------------------------------------------
  # macOS: AppleClang, the other platform we claim to support.
  # ---------------------------------------------------------------------------
  macos:
    name: macos / clang
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The network module has no platform-specific code, so it gains nothing
      # from being built on a third platform. This job is where the disabled
      # configuration is exercised instead: the optional module's source, its
      # header and its umbrella include all have to disappear cleanly.
      - name: Configure
        run: cmake -S . -B build -DQLIB_WERROR=ON -DQLIB_BUILD_NET=OFF -DQLIB_BUILD_THREADS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build

  # ---------------------------------------------------------------------------
  # MSVC, static and shared. The shared variant is what actually exercises
  # QLIB_EXPORT / __declspec(dllexport) and QLIB_STATIC_DEFINE.
  # ---------------------------------------------------------------------------
  windows:
    name: windows / msvc / shared=${{ matrix.shared }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shared: [OFF, ON]
    steps:
      - uses: actions/checkout@v4

      # QLIB_BUILD_BENCH is the only thing that compiles the
      # QueryPerformanceCounter timer path.
      - name: Configure
        run: cmake -S . -B build -DQLIB_WERROR=ON -DQLIB_BUILD_BENCH=ON -DQLIB_BUILD_THREADS=ON -DQLIB_BUILD_LOG=ON -DQLIB_SHARED=${{ matrix.shared }}

      # Split from the full build so a failure says which half broke. MSVC
      # cannot be run locally, so the only signal available is which step went
      # red: "Build library" means src/, "Build tests and benchmarks" means the
      # test or bench code.
      #
      # The diagnostics are also echoed as annotations. A job log needs admin
      # rights to download through the API, but annotations are public, so this
      # is what makes a Windows-only failure readable from a machine that
      # cannot run MSVC.
      - name: Build library
        shell: bash
        run: |
          set -o pipefail
          if ! cmake --build build --config Debug --target qlib --parallel 2>&1 | tee build-library.log; then
            grep -E "error C[0-9]+|error LNK|fatal error|warning C[0-9]+" build-library.log | head -6 |
              while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Build tests and benchmarks
        shell: bash
        run: |
          set -o pipefail
          if ! cmake --build build --config Debug --parallel 2>&1 | tee build-tests.log; then
            grep -E "error C[0-9]+|error LNK|fatal error|warning C[0-9]+" build-tests.log | head -6 |
              while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          if ! ctest --test-dir build -C Debug --output-on-failure 2>&1 | tee test.log; then
            grep -E "Failed|FAILED|FAIL:|Assertion|tests run" test.log | head -8 |
              while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # ThreadSanitizer on a second implementation. TSan is run locally on Linux
  # GCC/Clang, but AppleClang's runtime is a separate implementation and the
  # threading module is the one place where that difference could matter.
  # ---------------------------------------------------------------------------
  macos-tsan:
    name: macos / thread sanitizer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DQLIB_WERROR=ON
          -DQLIB_BUILD_THREADS=ON
          -DQLIB_BUILD_LOG=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS=-fsanitize=thread
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread

      # qlib_harness_selftest is excluded here. It runs a deliberately failing
      # probe executable and matches its report text; under AppleClang's
      # ThreadSanitizer the probe produces no report at all, which looks like
      # the runtime failing to load rather than a race. That self check is about
      # the minunit counters crossing a translation unit boundary, nothing to do
      # with threads, and it runs in every other job.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          if ! ctest --test-dir build --output-on-failure -E qlib_harness_selftest 2>&1 | tee test.log; then
            grep -E "WARNING: ThreadSanitizer|SUMMARY|Failed|FAIL:|tests run" test.log | head -8 |
              while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # AddressSanitizer + UndefinedBehaviorSanitizer (includes LeakSanitizer).
  # ---------------------------------------------------------------------------
  sanitizers:
    name: sanitizers / asan+ubsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Configure
        env:
          CC: clang
        run: cmake -S . -B build -DQLIB_WERROR=ON -DQLIB_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build

  # ---------------------------------------------------------------------------
  # libFuzzer. A short time-boxed run per CI invocation; a found crash makes the
  # job fail, and the crashing input is uploaded as the artifact.
  # ---------------------------------------------------------------------------
  fuzz:
    name: fuzz / libFuzzer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Configure
        env:
          CC: clang
        run: cmake -S . -B build -DQLIB_BUILD_FUZZ=ON -DQLIB_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Fuzz
        run: |
          for target in fuzz_vector fuzz_mem; do
            echo "=== $target ==="
            ./build/bin/$target -max_total_time=60 -max_len=256 -print_final_stats=1
          done

      - name: Upload crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash
          # Any of libFuzzer's artifact kinds, not just crashes.
          path: |
            crash-*
            oom-*
            leak-*
            timeout-*
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Documentation. Building it in CI is what keeps Doxyfile.in honest: a typo
  # or a stale input path fails here rather than silently producing a partial
  # reference for a release. Warnings are fatal, so the reference has to be
  # clean rather than merely present.
  # ---------------------------------------------------------------------------
  docs:
    name: docs / doxygen
    runs-on: ubuntu-24.04
    env:
      # Pinned, like clang-format and clang-tidy. The Doxyfile is warning-clean
      # against exactly this release, and warning output does drift between
      # Doxygen versions, so checking against the runner's older build would
      # make a red job mean "different Doxygen" rather than "bad docs".
      QLIB_DOXYGEN_VERSION: "1.18.0"
    steps:
      - uses: actions/checkout@v4

      # Needs nothing but python3, so it runs before the Doxygen install to
      # fail fast on a renamed page or a wrong "../" depth.
      - name: Check documentation links
        run: python3 ci/check_links.py

      - name: Install Doxygen ${{ env.QLIB_DOXYGEN_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-${QLIB_DOXYGEN_VERSION}.linux.bin.tar.gz"
          curl -fsSL -o /tmp/doxygen.tar.gz "$url"
          tar -xzf /tmp/doxygen.tar.gz -C /tmp
          echo "/tmp/doxygen-${QLIB_DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"

      # Fails loudly and immediately if the tarball layout ever changes.
      - name: Report the Doxygen version
        run: doxygen --version

      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Configure
        run: cmake -S . -B build -DQLIB_BUILD_DOCS=ON -DQLIB_BUILD_TESTS=OFF

      - name: Build the API reference
        run: cmake --build build --target docs 2>&1 | tee build/doxygen.log

      - name: Fail on any Doxygen warning
        run: |
          set -euo pipefail
          test -f docs/html/index.html
          echo "docs/html/index.html generated"
          # Guard the log itself: grepping a file that does not exist exits
          # non-zero, which would otherwise read as "no warnings found".
          test -f build/doxygen.log
          if grep -q "warning:" build/doxygen.log; then
            echo "Doxygen reported $(grep -c 'warning:' build/doxygen.log) warning(s):"
            grep "warning:" build/doxygen.log
            exit 1
          fi
          echo "no Doxygen warnings"

      - name: Upload the reference
        uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: docs/html
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Install tree: find_package() and pkg-config must both work for a downstream
  # consumer. Guards the export rules in the top level CMakeLists.txt.
  # ---------------------------------------------------------------------------
  package:
    name: install / find_package + pkg-config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and install
        run: |
          cmake -S . -B build -DQLIB_WERROR=ON -DQLIB_BUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
          cmake --build build --parallel
          cmake --install build

      # ci/consumer/ is checked in, so this job and ci/check.sh build exactly
      # the same consumer. A generated fixture drifted from the local one once
      # already and the divergence went unnoticed.
      - name: Build consumer with find_package
        run: |
          cmake -S ci/consumer -B build-consumer -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build build-consumer
          ./build-consumer/consumer

      - name: Build consumer with pkg-config
        run: |
          export PKG_CONFIG_PATH="$PWD/prefix/lib/pkgconfig"
          pkg-config --modversion qlib
          cc ci/consumer/main.c $(pkg-config --cflags --libs qlib) -o consumer_pc
          ./consumer_pc

  # ---------------------------------------------------------------------------
  # Formatting. clang-format output changes between releases, so the version is
  # pinned here and documented in CONTRIBUTING.md.
  # ---------------------------------------------------------------------------
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pinned clang-format
        run: pip install clang-format==23.1.1

      - name: Check formatting
        run: |
          files=$(git ls-files '*.c' '*.h')
          echo "checking: $files"
          clang-format --dry-run --Werror $files

  # ---------------------------------------------------------------------------
  # Static analysis. PyPI has no clang-tidy beyond 18.x, so this comes from
  # LLVM's apt repository, pinned to the 23.1 series the rules were verified
  # against.
  # ---------------------------------------------------------------------------
  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-tidy 23
        run: |
          # The key must be dearmored. Piping the ASCII-armored key straight to
          # a signed-by keyring leaves apt's verifier (gpgv, which does not
          # dearmor) unable to read it, and the failure surfaces as "invalid
          # packet" from an unsigned repository rather than as a key problem.
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor --yes -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y clang-tidy-23

      - name: Configure for the compilation database
        run: cmake -S . -B build -DQLIB_BUILD_THREADS=ON -DQLIB_BUILD_LOG=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Analyse
        run: clang-tidy-23 src/*.c tests/*.c -p build
